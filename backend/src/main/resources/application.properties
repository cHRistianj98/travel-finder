spring.application.name=travel-finder
server.port=8081
spring.jackson.serialization.write-dates-as-timestamps=false
# Celowo bez datasource: PostgreSQL nie jest potrzebny w pierwszym vertical slice.

# Import opcjonalnego, lokalnego pliku z sekretem przy uruchomieniu z folderu backend/.
# Format C:/projekty/travel-finder/.env.local: SEARCHAPI_KEY=twoj_klucz
spring.config.import=optional:file:../.env.local[.properties]
searchapi.api-key=${SEARCHAPI_KEY:}
searchapi.max-destinations=3
searchapi.max-outbounds-per-destination=2

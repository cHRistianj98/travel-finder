spring.application.name=travel-finder
server.port=8081
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
# PostgreSQL bez zmian; wyszukiwanie lotów nie wymaga tabel.
spring.config.import=optional:file:../.env.local[.properties]
searchapi.api-key=${SEARCHAPI_KEY:}

searchapi.max-destinations=3
searchapi.max-calendar-pairs-per-destination=2
searchapi.max-outbounds-per-pair=1


flights.provider=travelpayouts
travelpayouts.api-token=${TRAVELPAYOUTS_TOKEN:}
# Do 1000 ofert na stronę; kolejną pobieramy tylko gdy poprzednia jest pełna.
travelpayouts.max-pages-per-month=2
# W pamięci Spring Boot: 6 godzin. Filtry użytkownika nie generują zapytań HTTP.
travelpayouts.cache-hours=6

# Darmowe oficjalne PKP PLK Open Railway Data API — wymagany przydzielony klucz.
plk.api-key=${PLK_API_KEY:}
plk.enabled=${PLK_ENABLED:false}
plk.cache-hours=12
# Maksymalna dlugosc jednego wyjazdu kolejowego (dni).
plk.max-trip-days=5


# Rzeczywisty planowy rozkład FlixBus Europe (GTFS, dane otwarte ODbL).
# Nie jest to lista wszystkich przewoźników autobusowych ani aktualnych cen biletów.
bus.enabled=${BUS_ENABLED:true}
bus.gtfs-url=https://gtfs.gis.flix.tech/gtfs_generic_eu.zip
bus.cache-path=.cache/flixbus_europe_gtfs.zip
bus.cache-hours=24
bus.max-trip-days=5
bus.max-results=40

# Ceny FlixBus: 30-minutowy cache par kursów. Brak zapytań cenowych bez oficjalnego adaptera.
# Źródło GTFS nie zawiera cen, więc domyślny gateway zwraca brak ceny.
bus.fares.cache-minutes=30

# Publiczne MINIMALNE ceny reklamowane na stronach relacji FlixBus (NIE ceny wybranych kursów).
# Brak konta, klucza, abonamentu. Cache: 24h dla ceny, 1h dla braku danych.
# Możesz wyłączyć w .env.local: FLIX_PUBLIC_PREVIEW_ENABLED=false
bus.public-preview.enabled=${FLIX_PUBLIC_PREVIEW_ENABLED:true}

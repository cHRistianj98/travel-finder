services:
  postgres:
    image: postgres:17-alpine
    container_name: travel-finder-postgres
    environment:
      POSTGRES_DB: travel_finder
      POSTGRES_USER: travel_finder
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5434:5432"
    volumes:
      - travel_finder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_finder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  travel_finder_pgdata:
